name: LockscreenCanvas
options:
  bundleIdPrefix: com.anubhavgupta
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

configs:
  Debug: debug
  Release: release
  # Free Personal Teams cannot sign the App Group entitlement. The default
  # scheme runs this configuration so the app installs from Xcode without a
  # paid account. Widgets are still embedded; they just can't read the canvas
  # until you switch to the Shared scheme.
  Personal: debug

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Personal:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O

targets:
  LockscreenCanvas:
    type: application
    platform: iOS
    sources:
      - path: LockscreenCanvas
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anubhavgupta.lockscreen-canvas
        INFOPLIST_FILE: LockscreenCanvas/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: LockscreenCanvas/LockscreenCanvas.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Personal:
          CODE_SIGN_ENTITLEMENTS: Config/Empty.entitlements
    dependencies:
      - target: LockscreenCanvasWidget
        embed: true
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  LockscreenCanvasWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LockscreenCanvasWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anubhavgupta.lockscreen-canvas.widget
        INFOPLIST_FILE: LockscreenCanvasWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: LockscreenCanvasWidget/LockscreenCanvasWidget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Personal:
          CODE_SIGN_ENTITLEMENTS: Config/Empty.entitlements
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  LockscreenCanvas:
    build:
      targets:
        LockscreenCanvas: all
        LockscreenCanvasWidget: all
    run:
      config: Personal
    test:
      config: Personal
    profile:
      config: Personal
    analyze:
      config: Debug
    archive:
      config: Personal
  LockscreenCanvas Shared:
    build:
      targets:
        LockscreenCanvas: all
        LockscreenCanvasWidget: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
